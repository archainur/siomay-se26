name: Build and publish SIOMAY portable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install application dependencies
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Verify HEIC decoder in build environment
        run: python -c "from utils.images import HAS_HEIF; assert HAS_HEIF, 'pillow-heif/native HEIF codec unavailable'"

      - name: Build portable application
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          FLET_CLI_NO_RICH_OUTPUT: "1"
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $channel = if ($tag.Contains("-")) { "beta" } else { "stable" }
          if ($channel -eq "beta") {
            $baseVersion, $prerelease = $version -split '-', 2
            $prereleaseNum = [int]($prerelease -replace '^\D+', '')
            $buildVersion = "$baseVersion.0.$prereleaseNum"
          } else {
            $buildVersion = $version
          }
          git clone --local . release-source
          (Get-Content release-source/src/release.py) `
            -replace 'DISPLAY_VERSION = ".*"', "DISPLAY_VERSION = `"v$version`"" `
            -replace 'PACKAGE_VERSION = ".*"', "PACKAGE_VERSION = `"$buildVersion`"" `
            -replace 'RELEASE_CHANNEL = ".*"', "RELEASE_CHANNEL = `"$channel`"" | Set-Content release-source/src/release.py
          Set-Location release-source
          flet build windows --yes --no-rich-output --no-compile-packages --python-version 3.13 --module-name app --project SIOMAY --product SIOMAY --artifact SIOMAY --build-version $buildVersion --output ../build

      - name: Bundle LibreOffice PDF converter
        shell: pwsh
        run: |
          # LibreOffice is a native dependency, not a Python package. Install
          # its official MSI into a temporary workspace directory, then place
          # that runtime beside SIOMAY.exe for a fully portable release.
          # Use the immutable official archive URL. Versions are removed from
          # /stable after supersession, which previously downloaded a tiny 404
          # response and caused msiexec error 1620.
          $version = "25.8.7.2"
          $msi = "LibreOffice_$version`_Win_x86-64.msi"
          $url = "https://downloadarchive.documentfoundation.org/libreoffice/old/$version/win/x86_64/$msi"
          $installRoot = Join-Path $PWD "libreoffice-install"
          $log = Join-Path $PWD "libreoffice-msi.log"
          # curl.exe retries handle transient network errors that
          # Invoke-WebRequest does not recover from on CI runners.
          & curl.exe --fail --show-error -L `
            --retry 5 --retry-delay 10 --retry-all-errors `
            --connect-timeout 30 --max-time 600 -o $msi $url
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download LibreOffice MSI from $url (curl exit $LASTEXITCODE)."
          }
          $msiInfo = Get-Item $msi
          if ($msiInfo.Length -lt 100MB) {
            throw "Downloaded LibreOffice MSI is unexpectedly small ($($msiInfo.Length) bytes)."
          }
          $expectedHeader = [byte[]](0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1)
          $actualHeader = [byte[]]::new(8)
          $stream = [System.IO.File]::OpenRead($msi)
          try {
            $bytesRead = $stream.Read($actualHeader, 0, $actualHeader.Length)
          } finally {
            $stream.Dispose()
          }
          if ($bytesRead -ne $actualHeader.Length) {
            throw "Downloaded file is too short to be a valid MSI."
          }
          if ([System.BitConverter]::ToString($actualHeader) -ne [System.BitConverter]::ToString($expectedHeader)) {
            throw "Downloaded file does not have a valid MSI compound-file header."
          }
          $arguments = "/i `"$msi`" /qn /norestart /L*v `"$log`" INSTALLLOCATION=`"$installRoot`""
          $installer = Start-Process -FilePath msiexec.exe -ArgumentList $arguments -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 200 }
            throw "LibreOffice MSI installation failed with exit code $($installer.ExitCode)."
          }
          $soffice = Join-Path $installRoot "program\soffice.com"
          if (-not (Test-Path $soffice -PathType Leaf)) {
            if (Test-Path $log) { Get-Content $log -Tail 200 }
            throw "LibreOffice installation completed but program\soffice.com is missing."
          }
          $exe = Get-ChildItem -Path build -Recurse -File -Filter "SIOMAY.exe" | Select-Object -First 1
          if ($null -eq $exe) { throw "Could not find SIOMAY.exe in build." }
          Copy-Item -Path $installRoot -Destination (Join-Path $exe.Directory.FullName "LibreOffice") -Recurse -Force

      - name: Verify packaged Python dependencies
        shell: pwsh
        run: |
          # Flet's Windows runner embeds CPython in-process; the final portable
          # application intentionally has no command-line python.exe to invoke.
          # --no-compile-packages preserves these import-critical source files.
          $exe = Get-ChildItem -Path build -Recurse -File -Filter "SIOMAY.exe" | Select-Object -First 1
          if ($null -eq $exe) { throw "Could not find SIOMAY.exe in build." }
          $appRoot = $exe.Directory.FullName
          $certifi = Get-ChildItem -Path $appRoot -Recurse -Directory -Filter certifi | Select-Object -First 1
          if ($null -eq $certifi) { throw "The packaged application does not contain certifi." }
          foreach ($relativePath in @("__init__.py", "core.py", "cacert.pem")) {
            $path = Join-Path $certifi.FullName $relativePath
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "The packaged certifi installation is incomplete: $relativePath is missing."
            }
          }
          $requests = Get-ChildItem -Path $appRoot -Recurse -Directory -Filter requests | Select-Object -First 1
          if ($null -eq $requests -or -not (Test-Path (Join-Path $requests.FullName "__init__.py") -PathType Leaf)) {
            throw "The packaged application does not contain a complete requests installation."
          }
          $pandas = Get-ChildItem -Path $appRoot -Recurse -Directory -Filter pandas | Select-Object -First 1
          if ($null -eq $pandas -or -not (Test-Path (Join-Path $pandas.FullName "__init__.py") -PathType Leaf)) {
            throw "The packaged application does not contain a complete pandas installation."
          }
          $pandasUtil = Join-Path $pandas.FullName "util\__init__.py"
          if (-not (Test-Path $pandasUtil)) {
            throw "The packaged pandas installation is incomplete: pandas.util is missing."
          }
          $heifPackage = Get-ChildItem -Path $appRoot -Recurse -Directory -Filter pillow_heif | Select-Object -First 1
          $heifModule = Get-ChildItem -Path $appRoot -Recurse -File -Filter "_pillow_heif*.pyd" | Select-Object -First 1
          $heifDll = Get-ChildItem -Path $appRoot -Recurse -File -Filter "libheif*.dll" | Select-Object -First 1
          $decoderDll = Get-ChildItem -Path $appRoot -Recurse -File -Filter "libde265*.dll" | Select-Object -First 1
          if ($null -eq $heifPackage -or $null -eq $heifModule -or $null -eq $heifDll -or $null -eq $decoderDll) {
            throw "The packaged application does not contain pillow-heif and its native HEIC decoder files."
          }
          $soffice = Join-Path $appRoot "LibreOffice\program\soffice.com"
          if (-not (Test-Path $soffice -PathType Leaf)) {
            throw "The packaged application does not contain LibreOffice required for DOCX-to-PDF conversion."
          }

      - name: Package portable ZIP and checksum
        id: package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "SIOMAY-$tag-windows.zip"
          $exe = Get-ChildItem -Path build -Recurse -File -Filter "SIOMAY.exe" | Select-Object -First 1
          if ($null -eq $exe) { throw "Could not find SIOMAY.exe in build." }
          Remove-Item -Path package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -Path package/SIOMAY -ItemType Directory -Force | Out-Null
          Copy-Item -Path (Join-Path $exe.Directory.FullName "*") -Destination package/SIOMAY -Recurse -Force
          Compress-Archive -Path package/SIOMAY -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          @(
            "## Checksums"
            ""
            "- ${zip}: $hash"
          ) | Set-Content -Path RELEASE_NOTES.md
          "prerelease=$($tag.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ steps.package.outputs.prerelease }}
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          files: |
            SIOMAY-*-windows.zip

      - name: Update release manifest on master
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $channel = if ($tag.Contains("-")) { "beta" } else { "stable" }
          if ($channel -eq "beta") {
            $baseVersion, $prerelease = $version -split '-', 2
            $prereleaseNum = [int]($prerelease -replace '^\D+', '')
            $buildVersion = "$baseVersion.0.$prereleaseNum"
          } else {
            $buildVersion = $version
          }
          $zip = "SIOMAY-$tag-windows.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $publishedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $manifest = [ordered]@{
            channel = $channel
            display_version = "v$version"
            package_version = $buildVersion
            published_at = $publishedAt
            mandatory = $false
            download_url = "https://github.com/archainur/siomay-se26/releases/tag/$tag"
            sha256 = $hash
            release_notes_url = "https://github.com/archainur/siomay-se26/releases/tag/$tag"
          }
          $manifestJson = $manifest | ConvertTo-Json -Depth 4

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout master
          $manifestPath = "updates/$channel.json"
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText((Join-Path $PWD $manifestPath), $manifestJson + "`n", $utf8NoBom)
          git add $manifestPath
          $changes = git status --porcelain
          if ($changes) {
            git commit -m "chore(release): update $channel manifest for $tag [skip ci]"
            git push origin master
          }
