name: Validate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python 3.14 validation
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install project dependencies
        run: python -m pip install .
      - name: Compile application sources
        run: python -m compileall -q app.py src utils tests
      - name: Run release unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate update manifests
        shell: python
        run: |
          import json
          from pathlib import Path

          for path in Path("updates").glob("*.json"):
              payload = json.loads(path.read_text(encoding="utf-8-sig"))
              required = {"channel", "display_version", "package_version", "download_url", "release_notes_url"}
              missing = required.difference(payload)
              if missing:
                  raise SystemExit(f"{path}: missing {sorted(missing)}")
